<style>
:root{--bg:#f6f0e1;--surf:#fffdf7;--surf2:#efe8d4;--ink:#16251f;--mute:#5a6d63;--brand:#0f3d2e;--on-brand:#fff;--mint:#13805a;--mintbg:#d6f3e4;--amber:#f5a524;--amberbg:#fff0cf;--red:#c0392b;--redbg:#fde3de;--hero:#0f3d2e;--line:rgba(15,61,46,.15);
--sh:0 1px 2px rgba(15,61,46,.08),0 14px 28px -16px rgba(15,61,46,.35);--r:18px;--r-s:12px;--tr:.25s cubic-bezier(.2,.7,.2,1);--nav:232px;--z-nav:20;--z-dlg:50;--z-toast:60;
--f:'Cairo','Inter',system-ui,sans-serif}
[data-theme=dark]{--bg:#09130f;--surf:#12211a;--surf2:#1a2d24;--ink:#e9f3ed;--mute:#9bb2a6;--brand:#3ddc97;--on-brand:#06251a;--mint:#3ddc97;--mintbg:#143a2b;--amber:#ffb84a;--amberbg:#3a2b10;--red:#ff8576;--redbg:#3d1d19;--hero:#124a37;--line:rgba(255,255,255,.11);
--sh:0 1px 0 rgba(255,255,255,.05) inset,0 16px 30px -16px rgba(0,0,0,.8)}
[lang=en]{--f:'Inter','Cairo',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{color-scheme:light dark}
body{font-family:var(--f);background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh;transition:background .3s,color .3s;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.shell{display:grid;grid-template-columns:var(--nav) 1fr;min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:6px;border-inline-end:1px solid var(--line);background:var(--surf);z-index:var(--z-nav)}
.logo{font-weight:800;font-size:1.5rem;display:flex;align-items:center;gap:8px;padding:4px 10px 16px}
.logo i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffd37a,var(--amber));box-shadow:0 0 0 3px var(--brand) inset;display:inline-block}
nav.side a{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:var(--r-s);text-decoration:none;color:var(--mute);font-weight:600;transition:var(--tr)}
nav.side a:hover{background:var(--surf2);color:var(--ink)}
nav.side a[aria-current=page]{background:var(--brand);color:var(--on-brand)}
main{padding:22px clamp(14px,3vw,36px) 60px;max-width:1180px;width:100%}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:1.5rem}
.tools{display:flex;gap:8px;align-items:center}
#st{font-size:.8rem;color:var(--mute);min-width:110px;text-align:end}
#st.fail{color:var(--red);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surf);border-radius:var(--r-s);padding:9px 16px;cursor:pointer;font-weight:600;transition:var(--tr);min-height:42px}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--brand);color:var(--on-brand);border-color:transparent}
.btn.amb{background:var(--amber);color:#2a1c00;border-color:transparent}
.btn.danger{background:var(--red);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;min-height:34px;font-size:.85rem}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin:16px 0}
.stat{transition:var(--tr)}.stat:hover{transform:translateY(-4px) rotateX(3deg)}
.stat small{color:var(--mute);font-weight:600}
.stat b{display:block;font-size:1.45rem;font-weight:800;unicode-bidi:isolate;margin-top:2px}
.pos{color:var(--mint)}.neg{color:var(--red)}
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.hero{background:var(--hero);color:#f6f0e1;border-radius:26px;padding:26px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;overflow:hidden;position:relative;box-shadow:var(--sh)}
.hero h2{font-size:clamp(1.4rem,3.5vw,2rem);font-weight:800}
.hero p{opacity:.85;margin:4px 0 14px;max-width:46ch}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.hero .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.hero .btn.amb{background:var(--amber);color:#2a1c00}
.coinwrap{perspective:700px;width:150px;height:150px;display:grid;place-items:center;transition:transform .2s}
.coin{width:104px;height:104px;position:relative;transform-style:preserve-3d;animation:spin 7s linear infinite}
.coin i,.coin span{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-weight:800;font-style:normal}
.coin i{background:#c9861a}
.coin span{background:radial-gradient(circle at 30% 25%,#ffe2a0,#f5a524 60%,#d98a0c);color:#6a3f00;font-size:1.7rem;box-shadow:0 0 0 6px #e29a14 inset;backface-visibility:hidden}
.coin .f{transform:translateZ(5px)}.coin .b{transform:rotateY(180deg) translateZ(5px)}
.coin i:nth-child(1){transform:translateZ(-4px)}.coin i:nth-child(2){transform:translateZ(-2px)}.coin i:nth-child(3){transform:translateZ(0)}.coin i:nth-child(4){transform:translateZ(2px)}.coin i:nth-child(5){transform:translateZ(4px)}
@keyframes spin{to{transform:rotateY(360deg)}}
.float{animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.bar{height:10px;border-radius:9px;background:var(--surf2);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:9px;background:var(--mint);transition:width .8s cubic-bezier(.2,.7,.2,1)}
.bar>i.w{background:var(--amber)}.bar>i.o{background:var(--red)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .m{flex:1;min-width:0}.row .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--mute)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.amt{font-weight:800;unicode-bidi:isolate;white-space:nowrap}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
input,select,textarea{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 12px;width:100%;min-height:42px}
label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 4px}
.empty{text-align:center;padding:30px 10px;color:var(--mute)}.empty .w{font-size:3rem;display:inline-block}
.donutbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.donut{width:150px;height:150px;transform:rotate(-90deg);flex:none}
.legend{flex:1;min-width:150px;font-size:.88rem;display:grid;gap:4px}
.legend div{display:flex;gap:8px;align-items:center}
.bars{display:flex;gap:8px;align-items:flex-end;height:150px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;font-size:.75rem;color:var(--mute)}
.bars p{display:flex;gap:3px;align-items:flex-end;height:120px;width:100%;justify-content:center;margin:0}
.bars i{width:38%;max-width:22px;border-radius:6px 6px 0 0;min-height:2px;transition:height .7s}
.stack{position:relative;width:70px;height:70px;flex:none}
.stack i{position:absolute;inset-inline:6px;height:9px;border-radius:50%;background:linear-gradient(#ffd37a,#e29a14);box-shadow:0 2px 0 #b5760d;animation:pop .4s backwards}
@keyframes pop{from{transform:translateY(-14px);opacity:0}}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:start;padding:6px;border-bottom:1px solid var(--line)}
.warn{background:var(--amberbg);border-radius:var(--r-s);padding:8px 12px;font-size:.9rem;margin-top:8px}
.warn.o{background:var(--redbg)}
dialog{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:22px;padding:22px;width:min(480px,94vw);max-height:92vh;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);z-index:var(--z-dlg)}
dialog[open]{animation:dlg .25s}@keyframes dlg{from{opacity:0;transform:translateY(14px) scale(.96)}}
dialog::backdrop{background:rgba(5,15,10,.6);backdrop-filter:blur(3px)}
dialog h2{font-size:1.2rem;margin-bottom:6px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.err{color:var(--red);font-weight:600;font-size:.9rem;min-height:1.2em;margin-top:6px}
.seg{display:flex;gap:6px}.seg label{flex:1;margin:0;border:1px solid var(--line);border-radius:var(--r-s);padding:8px;text-align:center;cursor:pointer}
.seg input{position:absolute;opacity:0;width:0;min-height:0}.seg label:has(input:checked){background:var(--brand);color:var(--on-brand)}
.seg label:has(input:focus-visible){outline:3px solid var(--amber)}
#toasts{position:fixed;inset-inline:0;bottom:84px;display:grid;justify-items:center;gap:8px;pointer-events:none;z-index:var(--z-toast)}
.toast{background:var(--brand);color:var(--on-brand);padding:11px 18px;border-radius:30px;box-shadow:var(--sh);animation:dlg .3s;max-width:92vw;font-weight:600}
.toast.e{background:var(--red);color:#fff}.toast.w{background:var(--amber);color:#2a1c00}
.remind{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--amberbg);border-radius:var(--r);padding:12px 16px;margin-bottom:14px}.remind span{flex:1;min-width:200px;font-weight:600}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:var(--z-toast)}
.conf i{position:absolute;top:-30px;font-style:normal;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.view.enter{animation:in .35s}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.sec{margin-top:22px}.sec>h3{margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0}
@media(max-width:820px){
.shell{grid-template-columns:1fr}
nav.side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px;border:0;border-top:1px solid var(--line);justify-content:space-around}
nav.side .logo{display:none}nav.side a{flex-direction:column;gap:0;padding:6px 8px;font-size:.72rem;flex:1;align-items:center;text-align:center}
main{padding-bottom:100px}#st{display:none}.coinwrap{display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.conf{display:none}}

}
// ---- dialogs ----
const dlg=$('#dlg');let cur=null;
function ask(title,body,okLabel,fn,o={}){dlg.innerHTML=`<form id="f" novalidate><h2>${title}</h2>${body}<p class="err" id="err" role="alert"></p><div class="btns"><button type="button" class="btn ghost" data-act="close">${t('cancel')}</button><button class="btn ${o.danger?'danger':'pri'}">${okLabel}</button></div></form>`;cur=fn;if(!dlg.open)dlg.showModal()}
dlg.addEventListener('submit',e=>{e.preventDefault();if(!cur)return;const r=cur(new FormData(e.target));if(r)$('#err').textContent=r;else dlg.close()});
dlg.addEventListener('close',()=>cur=null);
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
dlg.addEventListener('change',e=>{if(e.target.name==='type'){$('#csel').innerHTML=catsOf(e.target.value).map(c=>`<option value="${c.id}">${esc(c[L()])}</option>`).join('')}});
const fld=(l,n,v='',x='')=>`<label for="${n}">${l}</label><input id="${n}" name="${n}" value="${esc(v)}" ${x}>`;
function txForm(type,id){const x=id&&S.tx.find(y=>y.id===id);type=x?x.type:type;
 ask(x?t('edit'):t(type==='i'?'addIn':'addEx'),`${x?'':''}<div class="seg" role="radiogroup" aria-label="${t('type')}"><label><input type="radio" name="type" value="e" ${type==='e'?'checked':''}>${t('expense')}</label><label><input type="radio" name="type" value="i" ${type==='i'?'checked':''}>${t('income')}</label></div>
 ${fld(t('title'),'title',x?x.title:'','maxlength=120 required')}${fld(t('amount'),'amount',x?toIn(x.amt):'','inputmode=decimal')}
 <label for="csel">${t('cat')}</label><select id="csel" name="cat">${catsOf(type).map(c=>`<option value="${c.id}" ${x&&x.cat===c.id?'selected':''}>${esc(c[L()])}</option>`).join('')}</select>
 ${fld(t('date'),'date',x?x.date:today(),'type=date')}${fld(t('note'),'note',x?x.note:'','maxlength=500')}`,t('save'),fd=>{
  const title=fd.get('title').trim(),amt=toPi(fd.get('amount')),date=fd.get('date'),ty=fd.get('type');
  if(!title)return t('eTitle');if(!amt||amt<=0)return t('eAmt');if(!dateOK(date))return t('eDate');
  const rec={id:x?x.id:uid(),type:ty,amt,cat:fd.get('cat'),date,title,note:fd.get('note').trim()};
  const bs=ty==='e'?[level(spentM(),S.budget.total),level(spentCat(rec.cat),S.budget.cat[rec.cat])]:[0,0],ok0=ty==='e'&&date.slice(0,7)===mNow();
  const okk=op(()=>{if(x)Object.assign(S.tx.find(y=>y.id===id),rec);else S.tx.push(rec)});
  if(okk){const lv=ok0?Math.max(level(spentM(),S.budget.total),level(spentCat(rec.cat),S.budget.cat[rec.cat])):0;
   toast(lv===2?t('over'):lv===1&&Math.max(...bs)<1?t('near'):x?t('okEdit'):t(ty==='i'?'okIn':'okEx'),lv===2?'e':lv===1?'w':'')}
 })}
function budForm(){ask(t('manBud'),fld(t('bTotal')+' ('+t('amount')+')','total',S.budget.total?toIn(S.budget.total):'','inputmode=decimal')+`<h3 style="margin-top:14px;font-size:1rem">${t('catLim')}</h3>`+catsOf('e').map(c=>fld(esc(c[L()]),'c_'+c.id,S.budget.cat[c.id]?toIn(S.budget.cat[c.id]):'','inputmode=decimal')).join(''),t('save'),fd=>{
 const p=v=>{v=String(v).trim();return v===''?0:toPi(v)},tot=p(fd.get('total'));if(tot===null)return t('eNum');const cs={};
 for(const c of catsOf('e')){const v=p(fd.get('c_'+c.id));if(v===null)return t('eNum');if(v>0)cs[c.id]=v}
 if(op(()=>{S.budget.total=tot;S.budget.cat=cs}))toast(t('okEdit'))})}
function goalForm(id){const g=id&&S.goals.find(x=>x.id===id);ask(g?t('edit'):t('newGoal'),fld(t('gName'),'name',g?g.name:'','maxlength=80 required')+fld(t('gTarget'),'target',g?toIn(g.target):'','inputmode=decimal')+fld(t('gDate'),'date',g?g.date:'','type=date'),t('save'),fd=>{
 const name=fd.get('name').trim(),tg=toPi(fd.get('target')),d=fd.get('date');if(!name)return t('eName');if(!tg||tg<=0)return t('eAmt');if(d&&!dateOK(d))return t('eDate');
 if(op(()=>{if(g){const o=S.goals.find(x=>x.id===id);Object.assign(o,{name,target:tg,date:d,done:o.saved>=tg})}else S.goals.push({id:uid(),name,target:tg,saved:0,date:d,done:false})}))toast(t('okEdit'))})}
function contribForm(id){const g=S.goals.find(x=>x.id===id);ask(esc(g.name),fld(t('cAmt'),'amt','','inputmode=decimal'),t('contrib'),fd=>{const a=toPi(fd.get('amt'));if(!a||a<=0)return t('eAmt');
 let done=false;if(op(()=>{const o=S.goals.find(x=>x.id===id);o.saved+=a;if(!o.done&&o.saved>=o.target){o.done=true;done=true}})){if(done){celebrate();toast(t('goalDone'))}else toast(t('closer'))}})}
function confirmD(title,msg,okL,fn,danger){ask(title,`<p>${msg}</p>`,okL,()=>{fn()},{danger})}
// ---- backup ----
function doExport(){let data;try{data=clean(S);data={app:'FLOOSY',...data,exportedAt:new Date().toISOString()}}catch(e){return toast(t('expBad'),'e')}
 try{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download=`Floosy-Backup-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){return toast(t('expBad'),'e')}
 op(()=>{S.prefs.last=Date.now();S.prefs.snooze=0})&&toast(t('expOk'))}
function doImport(file){if(!file)return;const r=new FileReader();r.onerror=()=>toast(t('bad'),'e');
 r.onload=()=>{let n;try{if(file.size>5e6)throw 0;const o=JSON.parse(r.result);if(o.app!=='FLOOSY')throw 0;n=clean(o);n.exp=o.exportedAt}catch(e){return toast(t('bad'),'e')}
  const exp=n.exp&&!isNaN(new Date(n.exp))?new Date(n.exp).toLocaleString(loc()):'—';
  ask(t('impT'),`<p>${t('impM')}</p><div class="card" style="margin-top:10px"><div class="kv" style="padding:2px 0"><span>${t('bkDate')}</span><b>${exp}</b></div><div class="kv" style="padding:2px 0"><span>${t('nTx')}</span><b>${n.tx.length}</b></div><div class="kv" style="padding:2px 0"><span>${t('nBud')}</span><b>${Object.keys(n.budget.cat).length+(n.budget.total?1:0)}</b></div><div class="kv" style="padding:2px 0"><span>${t('nGoals')}</span><b>${n.goals.length}</b></div></div>`,t('impOk'),()=>{
   const old=JSON.stringify(S);try{localStorage.setItem('floosy.prev',old)}catch(e){}
   delete n.exp;try{S=clean(n);if(!save())throw 0;toast(t('impDone'));render(true)}catch(e){S=JSON.parse(old);try{localStorage.setItem(KEY,old)}catch(_){}toast(t('impFail'),'e');render()}},{danger:true})};
 r.readAsText(file)}
function remindCheck(){const P=S.prefs;if($('#rem')||!P.remind)return;const base=P.last||P.created,due=Date.now()-base>=P.days*864e5;
 if(!due||Date.now()<P.snooze||(window.__rs))return;window.__rs=1;
 $('#main').insertAdjacentHTML('afterbegin',`<div class="remind" id="rem" role="status"><span>${t('remMsg')}</span><button class="btn pri sm" data-act="export">${t('remNow')}</button><button class="btn sm" data-act="snooze">${t('remLater')}</button></div>`)}
// ---- events ----
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const id=b.dataset.id;
 switch(b.dataset.act){
 case'close':dlg.close();break;
 case'addex':txForm('e');break;case'addin':txForm('i');break;
 case'edtx':txForm('e',id);break;
 case'deltx':confirmD(t('delT'),t('delM'),t('del'),()=>op(()=>{S.tx=S.tx.filter(x=>x.id!==id)})&&toast(t('okDel')),true);break;
 case'bud':budForm();break;case'newgoal':goalForm();break;case'edgoal':goalForm(id);break;case'contrib':contribForm(id);break;
 case'delgoal':confirmD(t('delG'),t('delM'),t('del'),()=>op(()=>{S.goals=S.goals.filter(x=>x.id!==id)})&&toast(t('okDel')),true);break;
 case'go':location.hash=b.dataset.v;break;
 case'theme':{const dark=document.documentElement.dataset.theme==='dark';op(()=>{S.prefs.theme=dark?'light':'dark'});break}
 case'lang':op(()=>{S.prefs.lang=L()==='ar'?'en':'ar'});break;
 case'export':doExport();break;
 case'import':$('#file').click();break;
 case'snooze':op(()=>{S.prefs.snooze=Date.now()+864e5});$('#rem')?.remove();break;
 case'addcat':ask(t('addCat'),`<div class="seg"><label><input type="radio" name="k" value="e" checked>${t('expense')}</label><label><input type="radio" name="k" value="i">${t('income')}</label></div>`+fld(t('title'),'n','','maxlength=40'),t('save'),fd=>{const n=fd.get('n').trim();if(!n)return t('eName');op(()=>S.cats.push({id:'c_'+uid(),name:n,k:fd.get('k')}))});break;
 case'delcat':if(S.tx.some(x=>x.cat===id)||S.budget.cat[id])return toast(t('catUsed'),'w');op(()=>{S.cats=S.cats.filter(c=>c.id!==id)});break;
 case'reset':confirmD(t('resetT'),t('resetM'),t('resetOk'),()=>{const old=JSON.stringify(S);try{localStorage.setItem('floosy.prev',old)}catch(_){}const p=S.prefs;S=def();S.prefs.lang=p.lang;S.prefs.theme=p.theme;if(save())render();else{S=JSON.parse(old);toast(t('fail'),'e')}},true);break}});
document.addEventListener('input',e=>{const i=e.target.id,m={fq:'q',ft:'type',fc:'cat',ff:'from',fto:'to',fs:'sort'};if(m[i]){F[m[i]]=e.target.value;txList()}});
document.addEventListener('change',e=>{const i=e.target.id,P=S.prefs;
 if(i==='sn')op(()=>{P.name=e.target.value.trim().slice(0,40)});
 if(i==='so'){const v=String(e.target.value).trim(),neg=v.startsWith('-'),p=toPi(neg?v.slice(1):v||'0');if(p===null){$('#soe').textContent=t('eNum');return}$('#soe').textContent='';op(()=>{S.opening=neg?-p:p})}
 if(i==='sr')op(()=>{P.remind=e.target.checked});
 if(i==='sd'){const d=Math.round(+e.target.value);if(d>=1&&d<=90)op(()=>{P.days=d});else render()}});
$('#file').addEventListener('change',e=>{doImport(e.target.files[0]);e.target.value=''});
addEventListener('hashchange',()=>{view=location.hash.slice(1)||'dash';render(true);scrollTo(0,0)});
addEventListener('mousemove',e=>{const w=document.querySelector('.coinwrap');if(!w||matchMedia('(prefers-reduced-motion:reduce)').matches)return;w.style.transform=`rotateX(${(e.clientY/innerHeight-.5)*-14}deg) rotateY(${(e.clientX/innerWidth-.5)*14}deg)`});
render(true);
</script>
